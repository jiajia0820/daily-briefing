# Copy this file to config/config.yaml, then edit it for your own setup.

user:
  # City name used by QWeather GEO lookup.
  city: "Beijing"
  # Optional administrative area, useful when city names are ambiguous.
  city_adm: "Beijing"

modules:
  morning:
    general_news: true
    zhihu_hot: true
    interests: true
    hotlists: true
    bilibili: true
    weather: true
    quote: true
    podcast: true
  afternoon:
    ai_tip: true
    psychology: true
    brand_insight: true
    github_trending: true

interests:
  - name: "AI"
    keywords:
      - "AI"
      - "人工智能"
      - "大模型"
      - "LLM"
      - "AI Agent"
      - "GPT"
      - "OpenAI"
      - "DeepSeek"
    # Limit foreign/English-heavy sources in this interest section.
    # Set to -1 to disable the limit.
    max_foreign: 2
    foreign_sources:
      - "Hugging Face Blog"
      - "OpenAI Blog"
    foreign_url_domains:
      - "huggingface.co"
      - "openai.com"

bilibili:
  name: "B站热门"
  # popular: use Bilibili popular videos.
  # search: search by search_keywords.
  mode: "popular"
  count: 5
  # search_keywords: ["AI", "大模型"]

hotlists:
  enabled: true
  # NewsNow-style hotlist API used by the lightweight hotlist fetcher.
  api_url: "https://newsnow.busiyi.world/api/s"
  count_per_source: 10
  request_interval_ms: 500
  # Route titles that match AI keywords into the AI interest pool.
  route_ai_to_interests: true
  ai_keywords:
    - "AI"
    - "人工智能"
    - "大模型"
    - "LLM"
    - "Agent"
    - "GPT"
    - "OpenAI"
    - "Claude"
    - "DeepSeek"
    - "豆包"
    - "通义"
    - "智谱"
    - "Kimi"
  sources:
    - id: "baidu"
      name: "百度热搜"
    - id: "toutiao"
      name: "今日头条"
    - id: "weibo"
      name: "微博"
    - id: "zhihu"
      name: "知乎"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "thepaper"
      name: "澎湃新闻"

zhihu_hot:
  enabled: true
  count: 3

schedule:
  # Informational schedule settings. Actual GitHub Actions timing is controlled
  # by manual workflow dispatch or external repository_dispatch triggers.
  morning: "07:20"
  afternoon: "12:00"
  timezone: "Asia/Shanghai"

publisher:
  feishu:
    # app: Feishu app private message.
    # webhook: Feishu group bot webhook. App mode is the default path.
    mode: "app"
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    receive_id_type: "open_id"
    receive_id: "${FEISHU_RECEIVE_ID}"
    # webhook_url: "${FEISHU_WEBHOOK_URL}"

llm:
  provider: "openai"
  model: "gpt-5.5"
  api_key: "${OPENAI_API_KEY}"
  # Examples:
  # - https://api.openai.com/v1
  # - your OpenAI-compatible proxy endpoint
  base_url: "${OPENAI_BASE_URL}"

weather:
  provider: "qweather"
  api_key: "${QWEATHER_API_KEY}"
  # QWeather API host. Use the host assigned in your QWeather console.
  api_host: "your-qweather-host.example.com"

dedup:
  retention_days: 7
