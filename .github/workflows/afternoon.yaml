name: Afternoon Briefing

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 04:00 = CST 12:00
  workflow_dispatch:       # 手动触发

jobs:
  afternoon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run afternoon briefing
        run: python src/afternoon.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}

      - name: Commit generated topics history
        run: |
          git config user.name "daily-briefing-bot"
          git config user.email "bot@daily-briefing"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update generated topics"
          git push
